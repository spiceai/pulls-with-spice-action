name: 'Pulls with Spice Action'
description: 'Ensures GitHub pull requests meet quality standards with extra flavor'
author: 'Luke Kim (Spice AI)'

inputs:
  require_description_min_length:
    description: 'Minimum length of the pull request description'
    required: false
    default: '0'
  require_title_min_length:
    description: 'Minimum length of the pull request title'
    required: false
    default: '10'
  required_labels_any:
    description: 'Any of these labels must be present on the pull request (comma-separated)'
    required: false
  required_labels_all:
    description: 'All of these labels must be present on the pull request (comma-separated)'
    required: false
  required_label_prefixes:
    description: 'Require at least one label from each prefix category (comma-separated, e.g., kind/,area/)'
    required: false
  banned_labels:
    description: 'None of these labels should be present on the pull request (comma-separated)'
    required: false
  require_assignee:
    description: 'Whether to require at least one assignee'
    required: false
    default: 'false'
  enforce_draft:
    description: 'Whether to enforce non-draft pull requests'
    required: false
    default: 'false'
  required_issue_types:
    description: 'Pull request must include one of these issue types in conventional commit format (comma-separated)'
    required: false
  require_issue_type:
    description: "Require GitHub's native issue Type field to be set. Issues only — pull requests have no native type."
    required: false
    default: 'false'
  allowed_issue_types:
    description: "Restrict GitHub's native issue Type to these values (comma-separated, e.g. 'Bug,Feature,Task'). Issues only."
    required: false
  require_priority_for_types:
    description: "Require a priority when the native issue Type is one of these (comma-separated, e.g. 'Bug'). Issues only."
    required: false
  priority_field_name:
    description: 'Name of the native single-select issue field holding priority'
    required: false
    default: 'Priority'
  require_milestone:
    description: 'Whether to require a milestone on the pull request'
    required: false
    default: 'false'
  branch_name_pattern:
    description: 'Regex pattern that branch names must match'
    required: false
  auto_label:
    description: 'Enable automatic labeling based on file paths and conventional commits'
    required: false
    default: 'false'
  auto_label_type:
    description: 'Automatically add type labels based on conventional commit prefixes in title'
    required: false
    default: 'false'
  auto_assign:
    description: 'Enable automatic assignment of PRs'
    required: false
    default: 'false'
  auto_assign_author:
    description: 'Automatically assign the PR author as an assignee'
    required: false
    default: 'false'
  auto_assign_users:
    description: 'Comma-separated list of users to automatically assign to PRs'
    required: false
  custom_error_messages:
    description: 'JSON object with custom error messages for various checks'
    required: false
  spice_api_key:
    description: "Spice Cloud API key for AI-powered features. A key starting with 'sk-' is treated as an OpenAI key and used against OpenAI directly."
    required: false
  spice_cloud_region:
    description: 'Spice Cloud region: us-east-1 or us-west-2. Ignored when using an OpenAI key.'
    required: false
    default: 'us-east-1'
  ai_auto_label:
    description: 'Review the labels applied to the pull request with an AI model, adding and removing labels it judges wrong'
    required: false
    default: 'false'
  ai_model:
    description: "Model name, passed to the endpoint verbatim. On Spice Cloud this is the model's name in your spicepod; against OpenAI it is a model id such as 'gpt-5.4'."
    required: false
    default: 'openai'
  github_token:
    description: 'GitHub token for posting comments to PR thread'
    required: false
    default: '${{ github.token }}'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'check-circle'
  color: 'orange'
