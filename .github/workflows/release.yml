name: Release

# Publishing is driven from here rather than from `release: published`.
#
# `dist/` is not committed to the branch, so a tag is only usable once the bundle has
# been built onto it. Building *after* a release is published inverts that: the tag goes
# live naming an entry point that does not exist yet, stays broken if the build fails,
# and the exact-version tag has to be force-moved afterwards — which is both a poor
# provenance story and something tag protection can simply reject.
#
# So the order is: build, verify the bundle runs, create the version tag once at the
# commit that contains it, and only then publish the release. A version tag is never
# moved; only the floating major tag is.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v3.1.0'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease (does not move the major tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags are needed to tell an existing version tag from a new one.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate the requested version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Refusing to release '$VERSION': expected vX.Y.Z or vX.Y.Z-suffix." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Refusing to release '$VERSION': that tag already exists and version tags are immutable." >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build

      - name: Verify the bundle runs
        # A tag that names a bundle Node cannot load is worse than no tag. With no event
        # payload the action should reject the event — reaching that message means the
        # bundle resolved every import and executed.
        run: |
          test -f dist/index.js
          output="$(node dist/index.js 2>&1 || true)"
          if ! grep -q 'pull requests and issues' <<<"$output"; then
            echo "Built bundle did not run as expected:" >&2
            echo "$output" >&2
            exit 1
          fi

      - name: Tag the release
        env:
          VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          # dist/ is gitignored on the branch and committed only onto the tag. The commit
          # is a direct child of the released source commit, which stays reachable.
          git add -f dist/
          git commit -m "Build $VERSION"

          git tag -a "$VERSION" -m "$VERSION"
          git push origin "refs/tags/$VERSION"

          # The major tag floats by design — `@v3` is meant to follow the newest v3.
          # Prereleases are excluded so `@v3` never points at one.
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "Prerelease $VERSION: leaving the major tag where it is."
          elif [[ "$VERSION" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            MAJOR="v${BASH_REMATCH[1]}"
            git tag -fa "$MAJOR" -m "Update $MAJOR to $VERSION"
            git push origin "refs/tags/$MAJOR" --force
          fi

      - name: Publish the release
        env:
          VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            "${flags[@]}"
